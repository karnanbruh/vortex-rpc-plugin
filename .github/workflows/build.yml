name: Build VORTEX RPC

on:
  workflow_dispatch:
  push:
    paths:
      - "vortex-rpc-plugin.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - - name: Fix CMake runtime setting
        shell: pwsh
        run: |
          $file = "extracted/vortex-rpc-plugin/CMakeLists.txt"
          $content = Get-Content $file -Raw
          $content = $content.Replace("MultiThreadedDLLDebug", "MultiThreadedDebugDLL")
          Set-Content -Path $file -Value $content
